<script>
async function analyze() {
  const transcript = document.getElementById('input').value;
  if (!transcript.trim()) { alert('Paste a transcript first'); return; }

  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span> Analyzing…';

  try {
    const res = await fetch('http://localhost:3000/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript })
    });

    const data = await res.json();
    display(data);

  } catch (err) {
    document.getElementById('result').innerHTML =
      '<div class="empty-state">Could not connect to backend</div>';
  } finally {
    btn.disabled = false;
    status.textContent = '';
  }
}

function display(data) {
  const container = document.getElementById('result');

  if (!data) {
    container.innerHTML = '<div class="empty-state">Invalid response</div>';
    return;
  }

  const v = Number(data.score?.value || data.score || 0);
  const sc = v <= 4 ? 's-low' : v <= 6 ? 's-mid' : 's-high';

  // Normalize
  const evidence = Array.isArray(data.evidence)
    ? data.evidence
    : (data.evidence ? [{ quote: data.evidence }] : []);

  const kpis = Array.isArray(data.kpiMapping)
    ? data.kpiMapping
    : (data.kpiMapping ? [{ description: data.kpiMapping }] : []);

  const gaps = Array.isArray(data.gaps)
    ? data.gaps
    : (data.gaps ? [{ gap: data.gaps }] : []);

  const qs = Array.isArray(data.followUpQuestions)
    ? data.followUpQuestions
    : [];

  let h = `
    <div class="score-block">
      <div class="score-badge ${sc}">
        <span class="num">${v}</span>
        <span class="den">/ 10</span>
      </div>
      <div class="score-info">
        <h2>${data.score?.label || ''}</h2>
        <p>${data.score?.justification || ''}</p>
      </div>
    </div>`;

  // Evidence
  h += `<div class="section"><div class="sec-title">Evidence — accept or reject each finding</div>`;
  if (!evidence.length) {
    h += `<div class="ev-item"><div class="ev-interp">No evidence extracted</div></div>`;
  } else {
    evidence.forEach((e, i) => {
      const q = e.quote || "No quote available";
      const interp = e.interpretation || "No interpretation";

      h += `<div class="ev-item" id="ev-${i}">
        <div class="ev-quote">"${q}"</div>
        <div class="ev-interp">${interp}</div>
        <div class="ev-actions">
          <button class="btn-a" onclick="mark(${i},'accepted')">Accept</button>
          <button class="btn-r" onclick="mark(${i},'rejected')">Reject</button>
        </div>
      </div>`;
    });
  }
  h += `</div>`;

  // KPI
  h += `<div class="section"><div class="sec-title">KPI Mapping</div>`;
  if (!kpis.length) {
    h += `<div class="kpi-item"><span class="kpi-desc">No KPI mapping extracted</span></div>`;
  } else {
    kpis.forEach(k => {
      const label = k.kpi || 'KPI';
      const desc = k.description || "No details";

      h += `<div class="kpi-item">
        <span class="kpi-tag">${label}</span>
        <span class="kpi-desc">${desc}</span>
      </div>`;
    });
  }
  h += `</div>`;

  // Gaps
  h += `<div class="section"><div class="sec-title">Gaps</div>`;
  if (!gaps.length) {
    h += `<div class="gap-item"><div class="gap-why">No gaps identified</div></div>`;
  } else {
    gaps.forEach(g => {
      const name = g.gap || "Unknown";
      const detail = g.importance || "No details";

      h += `<div class="gap-item">
        <div class="gap-name">${name}</div>
        <div class="gap-why">${detail}</div>
      </div>`;
    });
  }
  h += `</div>`;

  // Questions
  h += `<div class="section"><div class="sec-title">Suggested Follow-up Questions</div>`;
  if (!qs.length) {
    h += `<div class="fq-item">No follow-up questions</div>`;
  } else {
    qs.forEach((q, i) => {
      const txt = typeof q === 'string' ? q : (q.question || "No question");

      h += `<div class="fq-item">
        <span class="fq-num">Q${i + 1}</span>
        <span>${txt}</span>
      </div>`;
    });
  }
  h += `</div>`;

  container.innerHTML = h;
}

function mark(i, state) {
  const el = document.getElementById(`ev-${i}`);
  if (!el) return;
  el.classList.remove('accepted', 'rejected');
  el.classList.add(state);
}
</script>
