<!DOCTYPE html>
<html>
<head>
  <title>Supervisor Feedback Analyzer</title>
  <style>
    body {
      font-family: Arial;
      margin: 30px;
      background: #f9fafb;
    }

    h1 {
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      height: 180px;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }

    .card {
      background: white;
      padding: 15px;
      margin-top: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .container {
      display: flex;
      gap: 20px;
    }

    .left, .right {
      width: 50%;
    }
  </style>
</head>

<body>

<h1>Supervisor Feedback Analyzer</h1>

<div class="container">

  <!-- LEFT: INPUT -->
  <div class="left">
    <p>Paste transcript:</p>
    <textarea id="input"></textarea>
    <br>
    <button onclick="analyze()">Run Analysis</button>
  </div>

  <!-- RIGHT: OUTPUT -->
  <div class="right" id="result"></div>

</div>

<script>
async function analyze() {
  const transcript = document.getElementById('input').value;

  if (!transcript.trim()) {
    alert("Paste something first");
    return;
  }

  try {
    const res = await fetch('http://localhost:3000/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript })
    });

    const data = await res.json();
    display(data);

  } catch (err) {
    console.error(err);
    document.getElementById('result').innerHTML = "❌ Error connecting to backend";
  }
}

function display(data) {

  if (!data || !data.score) {
    document.getElementById('result').innerHTML = "⚠️ Invalid response from AI";
    return;
  }

  let html = '';

  // SCORE
  html += `
    <div class="card">
      <h2>Score: ${data.score.value} (${data.score.label})</h2>
      <p>${data.score.justification || ""}</p>
    </div>
  `;

  // EVIDENCE
  html += `<div class="card"><h3>Evidence</h3>`;
  if (data.evidence && data.evidence.length > 0) {
    (data.evidence || []).forEach(e => {
      const quote = e.quote || e.text || "No quote";
      const interp = e.interpretation || "";
      html += `<p><strong>"${quote}"</strong><br><em>${interp}</em></p>`;
    });
  } else {
    html += `<p>No evidence extracted</p>`;
  }
  html += `</div>`;

  // KPI MAPPING
  html += `<div class="card"><h3>KPI Mapping</h3>`;
  if (data.kpiMapping && data.kpiMapping.length > 0) {
   (data.kpiMapping || []).forEach(k => {
  const label = k.kpi || k.KPI || k.kpi_name || "Unknown";
  const detail = k.description || k.evidence || k.mapping || k.TAT || k.value || "No detail";
  html += `<p>• <strong>${label}</strong>: ${detail}</p>`;
});
  } else {
    html += `<p>No clear KPI mapping</p>`;
  }
  html += `</div>`;

  // GAPS
  html += `<div class="card"><h3>Gaps</h3>`;
  if (data.gaps && data.gaps.length > 0) {
    (data.gaps || []).forEach(g => {
      const label = g.gap || g.dimension || g.description || "Unknown";
      const detail = g.justification || g.importance || g.significance || g.detail || "No detail";
      html += `<p>• <strong>${label}</strong>: ${detail}</p>`;
    });
  } else {
    html += `<p>No gaps identified</p>`;
  }
  html += `</div>`;

  // FOLLOW-UP QUESTIONS
  html += `<div class="card"><h3>Follow-up Questions</h3>`;
  if (data.followUpQuestions && data.followUpQuestions.length > 0) {
    (data.followUpQuestions || []).forEach(q => {
      html += `<p>• ${q.question || q || "No question"}</p>`;
    });
  } else {
    html += `<p>No follow-up questions</p>`;
  }
  html += `</div>`;

  document.getElementById('result').innerHTML = html;
}
</script>

</body>
</html>
