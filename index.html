<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Trinethra — Fellow Evaluation</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4f3ef;
      --surface: #ffffff;
      --border: #e0ded8;
      --text: #1a1917;
      --muted: #6b6963;
      --accept-bg: #eaf3de;
      --accept-text: #3b6d11;
      --accept-border: #c0dd97;
      --reject-bg: #fcebeb;
      --reject-text: #a32d2d;
      --reject-border: #f7c1c1;
      --tag-bg: #f0efe9;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      font-size: 16px;
      font-weight: 600;
      font-family: 'Fraunces', serif;
      letter-spacing: 0.01em;
    }

    header span {
      font-size: 11px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
    }

    .workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: calc(100vh - 53px);
    }

    .left-panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .panel-label {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      padding: 18px 20px;
      font-family: 'DM Mono', monospace;
      font-size: 12.5px;
      line-height: 1.75;
      color: var(--text);
      background: var(--surface);
    }

    textarea::placeholder { color: #c0beb8; }

    .left-footer {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .run-btn {
      background: var(--text);
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
    }

    .run-btn:hover { opacity: 0.82; }
    .run-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .status-txt {
      font-size: 12px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      display: inline-block;
    }

    .right-panel {
      overflow-y: auto;
      background: var(--bg);
      padding-bottom: 24px;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #b0aea8;
      font-size: 13px;
      gap: 8px;
    }

    /* SCORE */
    .score-block {
      margin: 18px 18px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 18px;
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .score-badge {
      width: 68px;
      height: 68px;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .score-badge .num { font-size: 30px; font-weight: 600; line-height: 1; }
    .score-badge .den { font-size: 11px; opacity: 0.65; margin-top: 2px; }

    .s-low  { background: #fcebeb; color: #a32d2d; }
    .s-mid  { background: #faeeda; color: #854f0b; }
    .s-high { background: #eaf3de; color: #3b6d11; }

    .score-info h2 { font-size: 14px; font-weight: 600; margin-bottom: 5px; }
    .score-info p  { font-size: 12.5px; color: var(--muted); line-height: 1.6; }

    /* SECTIONS */
    .section {
      margin: 10px 18px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
    }

    .sec-title {
      padding: 9px 14px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: #faf9f7;
    }

    /* EVIDENCE */
    .ev-item {
      padding: 13px 14px;
      border-bottom: 1px solid var(--border);
    }
    .ev-item:last-child { border-bottom: none; }
    .ev-item.accepted { background: var(--accept-bg); }
    .ev-item.rejected { background: var(--reject-bg); opacity: 0.55; }

    .ev-quote {
      font-family: 'DM Mono', monospace;
      font-size: 11.5px;
      line-height: 1.65;
      padding-left: 10px;
      border-left: 2px solid var(--border);
      margin-bottom: 7px;
      color: var(--text);
    }

    .ev-interp {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 9px;
    }

    .ev-actions { display: flex; gap: 7px; }

    .btn-a, .btn-r {
      font-size: 11px;
      font-weight: 500;
      padding: 3px 11px;
      border-radius: 3px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }

    .btn-a { background: var(--accept-bg); color: var(--accept-text); border: 1px solid var(--accept-border); }
    .btn-r { background: var(--reject-bg); color: var(--reject-text); border: 1px solid var(--reject-border); }
    .btn-a:hover, .btn-r:hover { opacity: 0.72; }

    /* KPI */
    .kpi-item {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }
    .kpi-item:last-child { border-bottom: none; }

    .kpi-tag {
      font-family: 'DM Mono', monospace;
      font-size: 10.5px;
      font-weight: 500;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      padding: 2px 8px;
      border-radius: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .kpi-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; }

    /* GAPS */
    .gap-item {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
    }
    .gap-item:last-child { border-bottom: none; }
    .gap-name { font-size: 13px; font-weight: 500; margin-bottom: 3px; }
    .gap-why  { font-size: 12px; color: var(--muted); line-height: 1.5; }

    /* FOLLOWUP */
    .fq-item {
      padding: 11px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 10px;
      font-size: 12.5px;
      line-height: 1.6;
    }
    .fq-item:last-child { border-bottom: none; }
    .fq-num {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
      padding-top: 3px;
    }
  </style>
</head>
<body>

<header>
  <h1>Trinethra — Fellow Evaluation</h1>
</header>

<div class="workspace">

  <div class="left-panel">
    <div class="panel-label">Supervisor Transcript</div>
    <textarea id="input" placeholder="Paste supervisor transcript here…"></textarea>
    <div class="left-footer">
      <button class="run-btn" id="runBtn" onclick="analyze()">Run Analysis</button>
      <span class="status-txt" id="status"></span>
    </div>
  </div>

  <div class="right-panel" id="result">
    <div class="empty-state">
      <div style="font-size:22px; opacity:0.25;">←</div>
      <div>Paste a transcript and run analysis</div>
    </div>
  </div>

</div>

<script>
async function analyze() {
  const transcript = document.getElementById('input').value;
  if (!transcript.trim()) { alert('Paste a transcript first'); return; }

  const btn = document.getElementById('runBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerHTML = '<span class="spinner"></span> Analyzing…';

  try {
    const res = await fetch('http://localhost:3000/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript })
    });
    const data = await res.json();
    display(data);
  } catch (err) {
    document.getElementById('result').innerHTML = '<div class="empty-state">Could not connect to backend</div>';
  } finally {
    btn.disabled = false;
    status.textContent = '';
  }
}

function display(data) {
  if (!data || !data.score) {
    document.getElementById('result').innerHTML = '<div class="empty-state">Invalid response — check console</div>';
    return;
  }

  const v = Number(data.score.value);
  const sc = v <= 4 ? 's-low' : v <= 6 ? 's-mid' : 's-high';

  let h = `
    <div class="score-block">
      <div class="score-badge ${sc}">
        <span class="num">${v}</span>
        <span class="den">/ 10</span>
      </div>
      <div class="score-info">
        <h2>${data.score.label || ''}</h2>
        <p>${data.score.justification || ''}</p>
      </div>
    </div>`;

  // Evidence
  h += `<div class="section"><div class="sec-title">Evidence — accept or reject each finding</div>`;
  (data.evidence || []).forEach((e, i) => {
    const q = e.quote || e.text || '';
    const interp = e.interpretation || '';
    h += `<div class="ev-item" id="ev-${i}">
      <div class="ev-quote">"${q}"</div>
      <div class="ev-interp">${interp}</div>
      <div class="ev-actions">
        <button class="btn-a" onclick="mark(${i},'accepted')">Accept</button>
        <button class="btn-r" onclick="mark(${i},'rejected')">Reject</button>
      </div>
    </div>`;
  });
  h += `</div>`;

  // KPI
  h += `<div class="section"><div class="sec-title">KPI Mapping</div>`;
  const kpis = data.kpiMapping || [];
  if (!kpis.length) {
    h += `<div class="kpi-item"><span class="kpi-desc">No KPI mapping extracted</span></div>`;
  } else {
    kpis.forEach(k => {
      const label = k.kpi || k.KPI || 'KPI';
      const desc  = k.description || k.evidence || k.mapping || '';
      h += `<div class="kpi-item"><span class="kpi-tag">${label}</span><span class="kpi-desc">${desc}</span></div>`;
    });
  }
  h += `</div>`;

  // Gaps
  h += `<div class="section"><div class="sec-title">Gaps</div>`;
  const gaps = data.gaps || [];
  if (!gaps.length) {
    h += `<div class="gap-item"><div class="gap-why">No gaps identified</div></div>`;
  } else {
    gaps.forEach(g => {
      const name   = g.gap || g.dimension || g.description || 'Unknown';
      const detail = g.importance || g.justification || g.reasoning || g.significance || '';
      h += `<div class="gap-item"><div class="gap-name">${name}</div><div class="gap-why">${detail}</div></div>`;
    });
  }
  h += `</div>`;

  // Follow-up
  h += `<div class="section"><div class="sec-title">Suggested Follow-up Questions</div>`;
  const qs = data.followUpQuestions || [];
  if (!qs.length) {
    h += `<div class="fq-item">No follow-up questions generated</div>`;
  } else {
    qs.forEach((q, i) => {
      const txt = typeof q === 'string' ? q : (q.question || '');
      h += `<div class="fq-item"><span class="fq-num">Q${i + 1}</span><span>${txt}</span></div>`;
    });
  }
  h += `</div>`;

  document.getElementById('result').innerHTML = h;
}

function mark(i, state) {
  const el = document.getElementById(`ev-${i}`);
  if (!el) return;
  el.classList.remove('accepted', 'rejected');
  el.classList.add(state);
}
</script>

</body>
</html>
